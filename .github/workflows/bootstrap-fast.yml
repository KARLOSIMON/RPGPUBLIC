name: RPGPUBLIC fast certified-data APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/prepare_public_client.py"
      - "scripts/patch_public_android_runtime.py"
      - ".github/workflows/bootstrap-fast.yml"

permissions:
  actions: read
  contents: read

env:
  OTCLIENT_SHA: d7b821fd99f7fdab0733561de16d0d84936c0db4
  OTSP_SHA: ae88e1828671b349e729dd21177dde15ea41e123
  BASE_FULL_SOURCE_RUN: "35106165346"

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout RPGPUBLIC
        uses: actions/checkout@v4

      - name: Download known-good full-source native shell
        uses: actions/download-artifact@v4
        with:
          name: rpgpublic-opentibia-1041-android
          path: .work/base-artifact
          repository: KARLOSIMON/RPGPUBLIC
          run-id: ${{ env.BASE_FULL_SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Verify base APK
        run: |
          set -euo pipefail
          base="$(find .work/base-artifact -type f -name 'RPGPUBLIC-OpenTibia-1041.apk' -print -quit)"
          test -n "$base"
          cp "$base" .work/base.apk
          unzip -p .work/base.apk assets/data.zip > .work/base-data.zip
          unzip -p .work/base-data.zip init.lua | grep -F '["thomas.proxy.rlwy.net"]'
          unzip -p .work/base-data.zip init.lua | grep -F 'protocol = 1041'
          test -s .work/base.apk

      - name: Fetch pinned public client sources
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/opentibiabr/otclient.git .work/otclient
          git -C .work/otclient fetch --depth 1 origin "${OTCLIENT_SHA}"
          git -C .work/otclient checkout --detach "${OTCLIENT_SHA}"

          git clone --filter=blob:none --no-checkout https://github.com/peonso/opentibia_sprite_pack.git .work/otsp
          git -C .work/otsp fetch --depth 1 origin "${OTSP_SHA}"
          git -C .work/otsp checkout --detach "${OTSP_SHA}"

      - name: Prepare and certify combat-first client data
        env:
          RPGPUBLIC_VERSION_CODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/prepare_public_client.py .work/otclient .work/otsp
          python3 scripts/patch_public_android_runtime.py .work/otclient

          grep -F 'RPGPUBLIC_MOBILE_BASELINE_V1' .work/otclient/modules/game_interface/gameinterface.lua
          grep -F 'RPGPUBLIC_FAT_FINGER_TARGET_V1' .work/otclient/modules/game_interface/widgets/uigamemap.lua
          grep -F 'RPGPUBLIC_HIDE_MOBILE_OUTFIT_V1' .work/otclient/modules/game_outfit/outfit.lua
          grep -F 'RPGPUBLIC_HIDE_MOBILE_CHARACTER_APPEARANCE_V1' .work/otclient/modules/client_entergame/characterlist.lua
          grep -F 'RPGPUBLIC_STICKY_MOBILE_BATTLE_TARGET_V1' .work/otclient/modules/game_battle/battle.lua
          grep -F 'RPGPUBLIC_STICKY_MOBILE_CHASE_V1' .work/otclient/modules/game_inventory/inventory.lua
          grep -F 'RPGPUBLIC already targeting ->' .work/otclient/modules/game_interface/gameinterface.lua
          grep -F '(not g_platform.isMobile()) and g_game.isAttacking()' .work/otclient/modules/game_interface/gameinterface.lua

      - name: Pack replacement data payload
        working-directory: .work/otclient
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          output = Path("../combat-data.zip")
          roots = [Path("data"), Path("mods"), Path("modules")]
          files = [Path("init.lua"), Path("otclientrc.lua"), Path("cacert.pem"), Path("config.ini")]

          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as archive:
              for root in roots:
                  for path in sorted(root.rglob("*")):
                      if path.is_file():
                          archive.write(path, path.as_posix())
              for path in files:
                  if path.exists():
                      archive.write(path, path.as_posix())
          PY

          unzip -p ../combat-data.zip modules/game_interface/gameinterface.lua | grep -F 'RPGPUBLIC_MOBILE_BASELINE_V1'
          unzip -p ../combat-data.zip modules/game_outfit/outfit.lua | grep -F 'RPGPUBLIC_HIDE_MOBILE_OUTFIT_V1'

      - name: Inject data into known-good native shell
        run: |
          set -euo pipefail
          cp .work/base.apk .work/rpgpublic-combat-unsigned.apk
          zip -qd .work/rpgpublic-combat-unsigned.apk 'META-INF/*' || true
          zip -qd .work/rpgpublic-combat-unsigned.apk assets/data.zip || true

          rm -rf .work/inject
          mkdir -p .work/inject/assets
          cp .work/combat-data.zip .work/inject/assets/data.zip
          (
            cd .work/inject
            zip -q -0 ../rpgpublic-combat-unsigned.apk assets/data.zip
          )

          unzip -p .work/rpgpublic-combat-unsigned.apk assets/data.zip > .work/final-data-pre-sign.zip
          unzip -p .work/final-data-pre-sign.zip modules/game_interface/gameinterface.lua | grep -F 'RPGPUBLIC_MOBILE_BASELINE_V1'
          unzip -p .work/final-data-pre-sign.zip modules/game_interface/gameinterface.lua | grep -F 'RPGPUBLIC already targeting ->'
          unzip -p .work/final-data-pre-sign.zip modules/game_interface/widgets/uigamemap.lua | grep -F 'RPGPUBLIC_FAT_FINGER_TARGET_V1'
          unzip -p .work/final-data-pre-sign.zip modules/game_outfit/outfit.lua | grep -F 'RPGPUBLIC_HIDE_MOBILE_OUTFIT_V1'

      - name: Re-sign with stable public development key
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -1)"
          zipalign="$(find "$sdk_root/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$apksigner"
          test -x "$zipalign"

          mkdir -p "$HOME/.android" .work/output
          base64 -d dev-signing/rpgpublic-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          echo "5009ec1283b8a8df0c054512ac8d9f53a236ad9635023e9782a71a85957a7726  $HOME/.android/debug.keystore" | sha256sum -c -

          "$zipalign" -p -f 4 .work/rpgpublic-combat-unsigned.apk .work/rpgpublic-combat-aligned.apk
          "$apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out .work/output/RPGPUBLIC-OpenTibia-1041-combat-hardening.apk \
            .work/rpgpublic-combat-aligned.apk

          "$apksigner" verify --verbose .work/output/RPGPUBLIC-OpenTibia-1041-combat-hardening.apk
          sha256sum .work/output/RPGPUBLIC-OpenTibia-1041-combat-hardening.apk | tee .work/output/SHA256.txt

          unzip -p .work/output/RPGPUBLIC-OpenTibia-1041-combat-hardening.apk assets/data.zip > .work/output/final-data.zip
          unzip -p .work/output/final-data.zip modules/game_interface/gameinterface.lua | grep -F 'RPGPUBLIC_MOBILE_BASELINE_V1'
          unzip -p .work/output/final-data.zip modules/game_interface/gameinterface.lua | grep -F 'RPGPUBLIC already targeting ->'
          unzip -p .work/output/final-data.zip modules/game_outfit/outfit.lua | grep -F 'RPGPUBLIC_HIDE_MOBILE_OUTFIT_V1'
          unzip -p .work/output/final-data.zip modules/game_battle/battle.lua | grep -F 'RPGPUBLIC_STICKY_MOBILE_BATTLE_TARGET_V1'
          unzip -p .work/output/final-data.zip modules/game_inventory/inventory.lua | grep -F 'RPGPUBLIC_STICKY_MOBILE_CHASE_V1'

      - name: Write physical combat gate
        run: |
          cat > .work/output/PHONE_TEST.txt <<'EOF'
          RPGPUBLIC COMBAT-FIRST HARDENING GATE

          1. App opens directly to usable portrait UI; no oversized customization window blocks play.
          2. Login/reconnect works.
          3. Movement and wall/water collision remain correct.
          4. One normal tap on Goblin immediately targets/attacks it.
          5. A slight one-tile miss around the visible Goblin still acquires it.
          6. Tapping the already-targeted Goblin again does NOT cancel the attack.
          7. Moving Goblin remains chased; mobile walking does not silently flip ChaseOpponent to DontChase.
          8. Real native weapon hits repeat until death/cancel/native combat rule.
          9. Hit blood must be blood/splash, not an armor/object sprite.
          10. Goblin death produces its blood corpse; tapping corpse opens its container.
          11. Backpack/container item movement still works.
          12. Beacon/light behavior is checked separately after combat.
          13. Reconnect and repeat tap -> chase -> kill once.
          EOF

      - name: Upload combat-hardening APK
        uses: actions/upload-artifact@v4
        with:
          name: rpgpublic-combat-hardening-1041
          path: |
            .work/output/RPGPUBLIC-OpenTibia-1041-combat-hardening.apk
            .work/output/SHA256.txt
            .work/output/PHONE_TEST.txt
          retention-days: 30
          if-no-files-found: error
