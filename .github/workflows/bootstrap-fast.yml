name: RPGPUBLIC fast bootstrap APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap-fast.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download proven Clean 10.41 bootstrap artifact
        env:
          BOOTSTRAP_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a0a4-81f4-b803-51b48482d651/raw?se=2026-09-16T14%3A25%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=60255479-d870-54f1-b0f9-004c2a2b8f6d&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T12%3A38%3A49Z&ske=2026-09-17T12%3A38%3A49Z&sks=b&skv=2026-02-06&sig=KNBcLNVFRn5lOXt5rHX/1ShMhtwwLZl2MvEo4s8lxDk%3D'
        run: |
          set -euo pipefail
          mkdir -p .work
          curl --fail --location --retry 3 "$BOOTSTRAP_URL" -o .work/bootstrap.zip
          unzip -q .work/bootstrap.zip -d .work/bootstrap
          base="$(find .work/bootstrap -type f -name '*.apk' -print -quit)"
          test -n "$base"
          cp "$base" .work/base.apk
          unzip -p .work/base.apk assets/data.zip > .work/base-data.zip
          unzip -p .work/base-data.zip init.lua | grep -F '["thomas.proxy.rlwy.net"]'
          unzip -p .work/base-data.zip init.lua | grep -F 'protocol = 1041'
          test -s .work/base.apk

      - name: Install APK repack tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -1)"
          zipalign="$(find "$sdk_root/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$apksigner"
          test -x "$zipalign"
          echo "APKSIGNER=$apksigner" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$zipalign" >> "$GITHUB_ENV"

      - name: Repackage as separate RPGPUBLIC app
        run: |
          set -euo pipefail
          apktool d -f .work/base.apk -o .work/decoded >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          p=Path(".work/decoded/AndroidManifest.xml")
          text=p.read_text(encoding="utf-8")
          if 'package="com.github.otclient"' in text:
              text=text.replace('package="com.github.otclient"', 'package="com.karlosimon.rpgpublic"', 1)
          elif 'package="com.karlosimon.rpgpublic"' not in text:
              raise SystemExit("Unexpected bootstrap Android package")
          p.write_text(text, encoding="utf-8")

          strings=Path(".work/decoded/res/values/strings.xml")
          if strings.exists():
              s=strings.read_text(encoding="utf-8")
              s=s.replace(">OpenTibia Clean<", ">RPGPUBLIC<").replace(">otclient<", ">RPGPUBLIC<")
              strings.write_text(s, encoding="utf-8")
          PY

          apktool b .work/decoded -o .work/rpgpublic-unsigned.apk >/dev/null
          "$ZIPALIGN" -p -f 4 .work/rpgpublic-unsigned.apk .work/rpgpublic-aligned.apk

          mkdir -p "$HOME/.android"
          base64 -d dev-signing/rpgpublic-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          echo "5009ec1283b8a8df0c054512ac8d9f53a236ad9635023e9782a71a85957a7726  $HOME/.android/debug.keystore" | sha256sum -c -

          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out .work/RPGPUBLIC-OpenTibia-1041.apk \
            .work/rpgpublic-aligned.apk
          "$APKSIGNER" verify --verbose .work/RPGPUBLIC-OpenTibia-1041.apk

      - name: Certify stock payload
        run: |
          set -euo pipefail
          unzip -p .work/RPGPUBLIC-OpenTibia-1041.apk assets/data.zip > .work/final-data.zip
          unzip -p .work/final-data.zip init.lua | grep -F '["thomas.proxy.rlwy.net"]'
          unzip -p .work/final-data.zip init.lua | grep -F 'port = 58136'
          unzip -p .work/final-data.zip init.lua | grep -F 'protocol = 1041'
          unzip -l .work/final-data.zip | grep -F 'data/things/1041/Tibia.dat'
          unzip -l .work/final-data.zip | grep -F 'data/things/1041/Tibia.spr'
          ! unzip -l .work/final-data.zip | grep -F 'game_rg045_proof'
          ! unzip -l .work/final-data.zip | grep -F 'original_terrain_proof_patch.png'
          sha256sum .work/RPGPUBLIC-OpenTibia-1041.apk | tee .work/RPGPUBLIC_APK_SHA256.txt

          cat > .work/PHONE_TEST.txt <<'EOF'
          RPGPUBLIC STOCK BASELINE

          This is not the customized PocketPVP client.

          1. RPGPUBLIC must install separately from PocketPVP.
          2. Login to the existing Clean 10.41 live server.
          3. Confirm movement and collision.
          4. Use stock target/attack on Goblin. Confirm attack starts.
          5. Enable stock chase/follow combat and confirm a moving Goblin remains attacked.
          6. Confirm repeated weapon hits and kill/corpse.
          7. Open backpack/container and move an item.
          8. Use/toggle the currently provided Beacon/light and report whether world lighting visibly changes.
          9. Report any stock-client failure before PocketPVP-specific client patches are reintroduced.
          EOF

      - name: Upload public baseline
        uses: actions/upload-artifact@v4
        with:
          name: rpgpublic-fast-stock-1041
          path: |
            .work/RPGPUBLIC-OpenTibia-1041.apk
            .work/RPGPUBLIC_APK_SHA256.txt
            .work/PHONE_TEST.txt
          retention-days: 30
          if-no-files-found: error
