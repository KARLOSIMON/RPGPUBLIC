name: RPGPUBLIC OTSP combat asset diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/inspect_otsp_combat_assets.py"
      - ".github/workflows/combat-assets.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OTSP
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/peonso/opentibia_sprite_pack.git .work/otsp
          git -C .work/otsp fetch --depth 1 origin ae88e1828671b349e729dd21177dde15ea41e123
          git -C .work/otsp checkout --detach ae88e1828671b349e729dd21177dde15ea41e123
          test -s .work/otsp/server_files/items.otb
      - name: Inspect blood splash mappings
        run: |
          set -euo pipefail
          python3 scripts/inspect_otsp_combat_assets.py .work/otsp/server_files/items.otb | tee combat-assets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: otsp-combat-assets
          path: combat-assets.txt
